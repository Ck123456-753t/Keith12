<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Page Not Found | PrimeTask Arcade</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:#f5f7fb;color:#17243a;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  display:grid;place-items:center;padding:20px;
}
.gateway{
  width:min(100%,480px);background:white;border:1px solid #e3e9f1;
  border-radius:22px;padding:35px 25px;text-align:center;
  box-shadow:0 20px 65px #17243a0c;
  animation:slideIn .7s ease both;
}
.brand{
  display:flex;justify-content:center;align-items:center;
  gap:10px;font-weight:950;font-size:13px;letter-spacing:.5px;
}
.brand-icon{
  width:39px;height:39px;background:#101c32;color:white;
  border-radius:11px;display:grid;place-items:center;font-size:18px;
}
.brand small{
  display:block;color:#8190a5;font-size:9px;
  letter-spacing:1.6px;text-align:left;
}
.search-art{
  width:125px;height:125px;margin:35px auto 20px;
  border:2px solid #e6edf6;border-radius:50%;
  display:grid;place-items:center;position:relative;
}
.search-art svg{width:67px;height:67px;stroke:#2878e8}
.search-art:after{
  content:"";position:absolute;width:13px;height:13px;
  background:#f28c28;border-radius:50%;right:15px;top:17px;
  animation:pulse 1.1s infinite;
}
.status{
  display:inline-block;padding:7px 12px;border-radius:30px;
  background:#fff3e6;color:#c66a12;font-size:10px;
  font-weight:950;letter-spacing:1.4px;
}
h1{font-size:clamp(25px,6vw,34px);margin:17px 0 9px;letter-spacing:-1px}
.description{font-size:13px;color:#64748b;line-height:1.7;margin:0 auto;max-width:340px}
.search-line{
  margin:27px 0 13px;height:6px;background:#edf1f6;
  border-radius:20px;overflow:hidden;
}
.search-progress{
  width:0;height:100%;border-radius:20px;background:#f28c28;
  animation:progress 2.5s ease-in-out forwards;
}
.message{
  font-size:11px;font-weight:800;color:#64748b;
  min-height:18px;animation:fadeText .8s ease both;
}
.redirect{
  display:inline-block;margin-top:24px;padding:13px 20px;
  border-radius:10px;background:#17243a;color:white;
  text-decoration:none;font-size:12px;font-weight:900;
}
.redirect:hover{background:#2878e8}
@keyframes progress{0%{width:0}35%{width:40%}65%{width:72%}100%{width:100%}}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
@keyframes slideIn{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeText{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .search-progress{width:100%}
}
</style>
</head>

<body>
<main class="gateway">
  <div class="brand">
    <span class="brand-icon">PT</span>
    <span>PRIMETASK WORKSPACE<small>ARCADE GATEWAY</small></span>
  </div>

  <div class="search-art">
    <svg viewBox="0 0 64 64" fill="none" stroke-width="3.5" stroke-linecap="round">
      <circle cx="27" cy="27" r="17"/>
      <path d="M40 40L55 55"/>
      <path d="M20 21L34 35M34 21L20 35" stroke="#f28c28"/>
    </svg>
  </div>

  <span class="status">404 · PAGE NOT FOUND</span>

  <h1>PAGE DOES NOT EXIST.</h1>
  <p class="description">
    We searched everywhere, but this page isn't here.
    Don't worry. There are plenty of worlds left to explore.
  </p>

  <div class="search-line"><div class="search-progress"></div></div>
  <div class="message" id="statusMessage">SEARCHING FOR YOUR PAGE...</div>

  <a class="redirect" href="/arcade/" id="continueButton">
    ENTER PRIMETASK ARCADE →
  </a>
</main>

<script>
(() => {
  const message = document.getElementById("statusMessage");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const messages = [
    "SEARCHING FOR YOUR PAGE...",
    "PAGE DOES NOT EXIST.",
    "DISCOVERING ANOTHER WORLD...",
    "WELCOME TO PRIMETASK ARCADE."
  ];

  let index = 0;

  if (!reduced) {
    const interval = setInterval(() => {
      index++;
      message.textContent = messages[Math.min(index, messages.length - 1)];
      if (index >= messages.length - 1) clearInterval(interval);
    }, 650);
  } else {
    message.textContent = "PAGE DOES NOT EXIST. ENTERING ARCADE...";
  }

  const delay = reduced ? 500 : 3000;
  window.setTimeout(() => {
    window.location.replace("/arcade/");
  }, delay);
})();
</script>
</body>
</html>
