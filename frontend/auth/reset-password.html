<!DOCTYPE html>
<html lang="en">
<head>
  
  
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b18">
  <title>Choose New Password | PrimeTask Workspace</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b18;
      --panel: #0b1426;
      --line: #1e304b;
      --text: #edf4ff;
      --muted: #91a3bd;
      --blue: #3987ff;
      --orange: #ff8b38;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 5%, #102954 0, transparent 38%),
        radial-gradient(ellipse at 90% 90%, #3c2014 0, transparent 28%),
        var(--bg);
    }
    .panel {
      width: 100%;
      max-width: 460px;
      padding: clamp(24px, 6vw, 38px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(11, 20, 38, .96);
      box-shadow: 0 24px 80px #0007;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      font-weight: 800;
      letter-spacing: -.3px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(145deg, var(--blue), #1751bc);
      box-shadow: 0 7px 22px #287bff35;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(27px, 6vw, 34px);
      letter-spacing: -1px;
    }
    .intro {
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 49px;
      padding: 13px 14px;
      border: 1px solid #2b3d58;
      border-radius: 10px;
      outline: none;
      color: var(--text);
      background: #071020;
      font: inherit;
    }
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #3987ff20;
    }
    .hint {
      margin: 8px 0 0;
      color: #8295af;
      font-size: 11px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      min-height: 49px;
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: linear-gradient(100deg, #2676f6, #1659ca);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #cbd8eb;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .message.show { display: block; }
    .message.success { border-color: #246b54; color: #aaf0d2; }
    .message.error { border-color: #7a3b46; color: #ffc2ca; }
    .back {
      display: block;
      margin-top: 25px;
      color: #9dc3ff;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .back:hover { color: white; }
    .foot {
      margin-top: 27px;
      color: #63748d;
      text-align: center;
      font-size: 11px;
    }
  
/* PrimeTask shared logo: preserve the original image proportions. */
.logo img, .brand-mark img, .brandmark img,
.brand-orb img, .hero-mark img, .mark img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: inherit;
}

</style>
<link rel="icon" type="image/svg+xml" href="/assets/primetask-logo.svg">
</head>
<body>
  <main class="panel">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">PT
      <span>PrimeTask Workspace</span>
    </div>

    <p class="eyebrow">Secure account access</p>
    <h1>Choose a new password</h1>
    <p class="intro">
      Use a strong password you do not use elsewhere. Reset links expire after
      15 minutes and can only be used once.
    </p>

    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="6"
          maxlength="72"
          required
        >
        <p class="hint">Use 12 to 72 characters.</p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          maxlength="72"
          required
        >
      </div>

      <button id="submitButton" type="submit">Update password</button>
    </form>

    <div id="formMessage" class="message" role="status" aria-live="polite"></div>
    <a class="back" href="login.html">← Return to login</a>
    <div class="foot">Creating Opportunities and delivering excellence.</div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script>
    (() => {
      "use strict";

      const form = document.getElementById("resetForm");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");
      const button = document.getElementById("submitButton");
      const message = document.getElementById("formMessage");
      const token = new URLSearchParams(window.location.search).get("token") || "";

      function showMessage(text, type) {
        message.textContent = text;
        message.className = "message show " + type;
      }

      if (!/^[a-f0-9]{64}$/i.test(token)) {
        form.hidden = true;
        showMessage(
          "This reset link is missing or invalid. Request a new password recovery email.",
          "error"
        );
      }

      confirmPassword.addEventListener("input", () => {
        confirmPassword.setCustomValidity(
          confirmPassword.value && confirmPassword.value !== password.value
            ? "The passwords do not match."
            : ""
        );
      });

      password.addEventListener("input", () => {
        confirmPassword.setCustomValidity(
          confirmPassword.value && confirmPassword.value !== password.value
            ? "The passwords do not match."
            : ""
        );
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();
        message.className = "message";

        if (!token) {
          showMessage("Request a new recovery email to get a valid reset link.", "error");
          return;
        }

        if (password.value.length < 6 || password.value.length > 72) {
          showMessage("Your password must contain 12 to 72 characters.", "error");
          password.focus();
          return;
        }

        if (password.value !== confirmPassword.value) {
          showMessage("The passwords do not match.", "error");
          confirmPassword.focus();
          return;
        }

        if (!window.PTW_API_BASE) {
          showMessage("The password service is not configured. Please try again later.", "error");
          return;
        }

        button.disabled = true;
        button.textContent = "Updating password…";

        try {
          const response = await fetch(
            window.PTW_API_BASE.replace(/\/+$/, "") + "/auth/reset-password",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ token, password: password.value })
            }
          );

          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              result.message || result.error ||
              "This reset link may have expired or already been used. Request a new one."
            );
          }

          form.reset();
          form.hidden = true;
          showMessage(
            result.message || "Your password has been updated. You can now log in with your new password.",
            "success"
          );
        } catch (error) {
          showMessage(
            error.message || "Unable to reach the password service. Please try again later.",
            "error"
          );
        } finally {
          button.disabled = false;
          button.textContent = "Update password";
        }
      });
    })();
  </script>
</body>
</html>
