<!DOCTYPE html>
<html lang="en" data-operator-roles="admin,founder">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Entry | Bid Purchases</title>
<script src="../../../../assets/js/config.js"></script>
<style>
:root{--bg:#17130d;--panel:#282116;--line:#55452a;--text:#fff8e8;--muted:#c2b494;--accent:#fbbf24;--green:#4ade80;--red:#fb7185;--blue:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(130deg,#17130df0,#30220deF),url('https://images.unsplash.com/photo-1554224154-26032ffc0d07?auto=format&fit=crop&w=1800&q=80') center/cover fixed;color:var(--text);font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#17130ded;border-bottom:1px solid var(--line);padding:16px;backdrop-filter:blur(14px)}
.top,nav,main{max-width:1150px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:5px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
nav a.active{background:var(--accent);color:#2b1b00;border-color:var(--accent);font-weight:bold}
main{padding:24px 15px 50px}
button,input,select{font:inherit;border-radius:9px;padding:10px;border:1px solid var(--line)}
button{cursor:pointer;font-weight:bold}
.refresh{background:var(--accent);color:#2b1b00;border:0}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
input,select{background:#211b11;color:var(--text)}
input{flex:1;min-width:180px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat,.card{background:#282116ed;border:1px solid var(--line);border-radius:13px;padding:15px}
.stat small,.muted{color:var(--muted)}
.stat strong{display:block;font-size:23px;margin-top:7px}
#list{display:grid;gap:12px}
.card h2{font-size:17px;margin:0 0 9px}
.details{font-size:13px;line-height:1.9;color:#f1e5c9;overflow-wrap:anywhere;white-space:pre-wrap}
.amount{font-size:22px;font-weight:bold;color:var(--accent);margin:12px 0 4px}
.bids{font-size:17px;color:var(--green);font-weight:bold}
.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#55452a;font-size:11px;margin:8px 5px 5px 0}
.status-verified{background:#14532d;color:#bbf7d0}
.status-failed,.status-cancelled{background:#881337;color:#ffe4e6}
.status-pending,.status-verification_required{background:#713f12;color:#fef3c7}
.empty{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
#error{color:#fda4af;margin-bottom:12px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
</style>
<link rel="icon" type="image/svg+xml" href="/assets/primetask-logo.svg">

  <script src="/assets/js/operator-guard.js" defer></script>
</head>
<body>
<header>
 <div class="top">
  <div><h1>Bid Purchases</h1><div class="sub">M-Pesa payment records and provider verification evidence</div></div>
  <button class="refresh" id="refresh">Refresh</button>
 </div>
 <nav>
  <a href="index">Overview</a>
  <a href="jobs">Jobs</a>
  <a href="in-progress">In Progress</a>
  <a href="submissions">Submissions</a>
  <a href="withdrawals">Withdrawals</a>
  <a class="active" href="bid-purchases">Bid Purchases</a>
  <a href="earnings">Earnings</a>
  <a href="transactions">Transactions</a>
  <a href="bid-packages">Bid Packages</a>
  <a href="reports">Reports</a>
 </nav>
</header>

<main>
 <div id="error"></div>
 <section class="stats">
  <div class="stat"><small>Verified payments</small><strong id="verifiedKes">KSh 0</strong></div>
  <div class="stat"><small>Verified bids</small><strong id="verifiedBids">0</strong></div>
  <div class="stat"><small>Purchase records loaded</small><strong id="recordCount">0</strong></div>
 </section>

 <div class="toolbar">
  <input id="search" placeholder="Search worker, phone, receipt or reference">
  <select id="status">
   <option value="">All payment statuses</option>
   <option value="pending">Pending</option>
   <option value="verification_required">Verification required</option>
   <option value="verified">Verified</option>
   <option value="failed">Failed</option>
   <option value="cancelled">Cancelled</option>
  </select>
 </div>
 <div id="list"><div class="empty">Loading purchase records...</div></div>
</main>

<script>
const API = `${window.PTW_API_BASE}/admin/data-entry`;
const list = document.getElementById("list");
const errorBox = document.getElementById("error");
let purchases = [];
let totals = [];

async function request(path) {
  const response = await fetch(`${API}${path}`, { credentials: "include" });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.success === false) {
    throw new Error(data.message || `Request failed (${response.status})`);
  }
  return data;
}

function el(tag, cls, value) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (value !== undefined) node.textContent = value;
  return node;
}

function kes(value) {
  return Number.isFinite(Number(value))
    ? `KSh ${Number(value).toLocaleString("en-KE")}`
    : "Unavailable";
}

function date(value) {
  if (!value) return "Unavailable";
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? "Unavailable" : parsed.toLocaleString();
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const status = document.getElementById("status").value;

  const filtered = purchases.filter(p => {
    const user = p.userId || {};
    const matchesStatus = !status || p.paymentStatus === status;
    const searchable = [
      user.name, user.email, p.purchaseReference,
      p.phoneNumber, p.mpesaReceipt, p.packageName,
      p.checkoutRequestId, p.merchantRequestId
    ].join(" ").toLowerCase();

    return matchesStatus && searchable.includes(query);
  });

  list.replaceChildren();

  if (!filtered.length) {
    list.append(el("div", "empty", "No purchase records match this filter."));
    return;
  }

  filtered.forEach(p => {
    const user = p.userId || {};
    const card = el("article", "card");

    card.append(el("h2", "", p.packageName || "Bid package purchase"));

    const details = el("div", "details");
    details.textContent =
      `Worker: ${user.name || "Unknown"}\n` +
      `Email: ${user.email || "Unavailable"}\n` +
      `Purchase reference: ${p.purchaseReference || "Unavailable"}\n` +
      `Phone: ${p.phoneNumber || "Unavailable"}\n` +
      `Created: ${date(p.createdAt)}\n` +
      `Updated: ${date(p.updatedAt)}`;
    card.append(details);

    card.append(el("div", "amount", kes(p.expectedAmountKes)));
    card.append(el("div", "bids", `${p.bids ?? 0} bids`));

    const statusClass = ["verified","failed","cancelled","pending","verification_required"]
      .includes(p.paymentStatus) ? `tag status-${p.paymentStatus}` : "tag";
    card.append(el("span", statusClass, `Payment: ${p.paymentStatus || "Unknown"}`));

    if (p.hasUnresolvedPayment) {
      card.append(el("span", "tag", "Unresolved payment"));
    }

    const evidence = el("div", "details");
    evidence.textContent =
      `Verified amount: ${p.verifiedAmountKes == null ? "Not verified" : kes(p.verifiedAmountKes)}\n` +
      `M-Pesa receipt: ${p.mpesaReceipt || "Not available"}\n` +
      `Verification method: ${p.verificationMethod || "Not verified"}\n` +
      `Evidence source: ${p.evidenceSource || "Not available"}\n` +
      `Evidence reference: ${p.evidenceReference || "Not available"}\n` +
      `Verified at: ${date(p.verifiedAt)}\n` +
      `Last reconciled: ${date(p.lastReconciledAt)}`;
    card.append(el("div", "tag", "Payment verification evidence"));
    card.append(evidence);

    const provider = el("div", "details");
    provider.textContent =
      `STK initiated: ${date(p.stkInitiatedAt)}\n` +
      `Checkout request ID: ${p.checkoutRequestId || "Unavailable"}\n` +
      `Merchant request ID: ${p.merchantRequestId || "Unavailable"}`;
    card.append(el("div", "tag", "Daraja request details"));
    card.append(provider);

    if (p.failureCode || p.failureDescription) {
      card.append(el("div", "details",
        `Failure code: ${p.failureCode || "Unavailable"}\nFailure description: ${p.failureDescription || "Unavailable"}`));
    }

    list.append(card);
  });
}

async function loadPurchases() {
  errorBox.textContent = "";
  list.replaceChildren(el("div", "empty", "Loading purchase records..."));

  try {
    const data = await request("/bid-purchases");
    purchases = Array.isArray(data.purchases) ? data.purchases : [];
    totals = Array.isArray(data.totals) ? data.totals : [];

    const verified = totals.find(item => item._id === "verified") || {};
    document.getElementById("verifiedKes").textContent = kes(verified.verifiedKes || 0);
    document.getElementById("verifiedBids").textContent =
      Number(verified.verifiedBids || 0).toLocaleString("en-KE");
    document.getElementById("recordCount").textContent =
      purchases.length.toLocaleString("en-KE");

    render();
  } catch (error) {
    purchases = [];
    list.replaceChildren(el("div", "empty", "Could not load purchase records."));
    errorBox.textContent = error.message;
  }
}

async function checkAdmin() {
  try {
    const response = await fetch(window.PTW_AUTH_API_ME, { credentials: "include" });
    const data = await response.json();
    const user = data.user || data;

    if (!response.ok || !["admin", "founder"].includes(user.role)) {
      document.body.replaceChildren(el("h2", "", "Access denied. Admin access required."));
      return false;
    }
    return true;
  } catch {
    document.body.replaceChildren(el("h2", "", "Authentication required. Please sign in."));
    return false;
  }
}

document.getElementById("refresh").addEventListener("click", loadPurchases);
document.getElementById("search").addEventListener("input", render);
document.getElementById("status").addEventListener("change", render);

(async () => {
  if (await checkAdmin()) await loadPurchases();
})();
</script>
</body>
</html>
