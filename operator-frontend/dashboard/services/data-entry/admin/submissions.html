<!DOCTYPE html>
<html lang="en" data-operator-roles="admin,founder">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Entry | Submissions</title>
<script src="../../../../assets/js/config.js"></script>
<style>
:root{--bg:#160e20;--panel:#26172f;--line:#493052;--text:#f8efff;--muted:#bba9c5;--accent:#f472b6;--accent2:#fb923c;--danger:#fb7185;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:Arial,sans-serif;background:linear-gradient(135deg,#160e20eF,#32162deF),url('https://images.unsplash.com/photo-1456324504439-367cee3b3c32?auto=format&fit=crop&w=1800&q=80') center/cover fixed;min-height:100vh}
header{background:#160e20eF;border-bottom:1px solid var(--line);padding:17px;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.top{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:21px;margin:0} .sub{color:var(--muted);font-size:12px;margin-top:5px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
nav a{color:#ead9f2;text-decoration:none;font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
nav a.active{background:var(--accent);color:#251020;border-color:var(--accent);font-weight:bold}
main{max-width:1150px;margin:25px auto;padding:0 15px 50px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}
input,select,textarea{background:#1c1224;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;min-width:0}
input{flex:1;min-width:180px}select{min-width:150px}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}
.refresh{background:var(--accent);color:#251020}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:17px}
.stat,.submission{background:#26172feF;border:1px solid var(--line);border-radius:14px;padding:15px}
.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:7px}
#list{display:grid;gap:13px}
.submission h2{font-size:17px;margin:0 0 7px}
.meta{font-size:12px;color:var(--muted);line-height:1.8}
.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#493052;color:#fce7f3;font-size:11px;margin:7px 5px 7px 0}
.content{background:#190f20;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:260px;overflow:auto}
.content a{color:#f9a8d4}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.approve{background:#4ade80;color:#102719}.reject{background:#fb7185;color:#310d18}.revise{background:#fb923c;color:#321707}
button:disabled{opacity:.5;cursor:not-allowed}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.empty,.error{padding:22px;text-align:center;background:#26172f;border:1px solid var(--line);border-radius:12px;color:var(--muted)}
#error{color:#fda4af;margin-bottom:12px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}h1{font-size:18px}}
</style>
<link rel="icon" type="image/svg+xml" href="/assets/primetask-logo.svg">

  <script src="/assets/js/operator-guard.js" defer></script>
</head>
<body>
<header>
 <div class="top">
  <div><h1>Submission Review</h1><div class="sub">Review worker deliverables and manage decisions</div></div>
  <button class="refresh" id="refresh">Refresh</button>
 </div>
 <nav>
  <a href="index">Overview</a>
  <a href="jobs">Jobs</a>
  <a href="in-progress">In Progress</a>
  <a class="active" href="submissions">Submissions</a>
  <a href="withdrawals">Withdrawals</a>
  <a href="bid-purchases">Bid Purchases</a>
  <a href="earnings">Earnings</a>
  <a href="transactions">Transactions</a>
  <a href="bid-packages">Bid Packages</a>
  <a href="reports">Reports</a>
 </nav>
</header>

<main>
 <div id="error"></div>
 <section class="stats">
  <div class="stat"><small>Awaiting review</small><strong id="pending">0</strong></div>
  <div class="stat"><small>Approved</small><strong id="approved">0</strong></div>
  <div class="stat"><small>Rejected</small><strong id="rejected">0</strong></div>
 </section>

 <div class="toolbar">
  <input id="search" placeholder="Search job, worker or email">
  <select id="status">
   <option value="submitted">Awaiting review</option>
   <option value="">All submissions</option>
   <option value="approved">Approved</option>
   <option value="rejected">Rejected</option>
   <option value="revision_requested">Revision requested</option>
  </select>
 </div>

 <div id="list"><div class="empty">Loading submissions...</div></div>
</main>

<script>
const API = `${window.PTW_API_BASE}/admin/data-entry`;
const list = document.getElementById("list");
const errorBox = document.getElementById("error");
let submissions = [];

async function request(path, options = {}) {
  const response = await fetch(`${API}${path}`, {
    credentials: "include",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.success === false) {
    throw new Error(data.message || `Request failed (${response.status})`);
  }
  return data;
}

function element(tag, className, value) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (value !== undefined) node.textContent = value;
  return node;
}

function money(cents) {
  return Number.isFinite(Number(cents))
    ? `$${(Number(cents) / 100).toFixed(2)}`
    : "Unavailable";
}

function date(value) {
  if (!value) return "Unavailable";
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? "Unavailable" : parsed.toLocaleString();
}

function addContent(parent, label, value) {
  const heading = element("div", "meta", label);
  const content = element("div", "content", value || "No content provided.");
  parent.append(heading, content);
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const filtered = submissions.filter(item => {
    const worker = item.userId || {};
    const order = item.orderId || {};
    const text = [
      item.orderTitle, order.title, order.category,
      worker.name, worker.email, item.submissionText,
      item.documentOriginalName
    ].join(" ").toLowerCase();
    return text.includes(query);
  });

  list.replaceChildren();

  if (!filtered.length) {
    list.append(element("div", "empty", "No submissions match this filter."));
    return;
  }

  filtered.forEach(item => {
    const worker = item.userId || {};
    const order = item.orderId || {};
    const card = element("article", "submission");

    card.append(element("h2", "", order.title || item.orderTitle || "Untitled job"));

    const metadata = element("div", "meta");
    metadata.textContent =
      `Worker: ${worker.name || "Unknown"} (${worker.email || "No email"})\n` +
      `Category: ${order.category || "Unavailable"}\n` +
      `Submitted: ${date(item.submittedAt)}\n` +
      `Reward: ${money(item.rewardCents)}\n` +
      `Revisions: ${item.revisionCount || 0}`;
    card.append(metadata);

    card.append(element("span", "tag", `Status: ${item.status}`));
    card.append(element("span", "tag", `Job: ${order.status || "Unavailable"}`));

    if (item.submissionText) {
      addContent(card, "Submission text", item.submissionText);
    }

    if (item.submissionLink) {
      const linkArea = element("div", "content");
      const link = element("a", "", "Open submitted link");
      link.href = item.submissionLink;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      linkArea.append(link);
      card.append(element("div", "meta", "Submission link"), linkArea);
    }

    if (item.documentOriginalName) {
      const fileInfo = [
        item.documentOriginalName,
        item.documentFormat ? `Format: ${item.documentFormat}` : "",
        Number.isFinite(Number(item.documentBytes))
          ? `Size: ${(Number(item.documentBytes) / 1024).toFixed(1)} KB` : ""
      ].filter(Boolean).join(" | ");
      addContent(card, "Uploaded document", fileInfo);
    }

    if (item.reviewNote) {
      addContent(card, "Latest review note", item.reviewNote);
    }

    if (Array.isArray(item.reviewHistory) && item.reviewHistory.length) {
      const history = item.reviewHistory.map(entry =>
        `${entry.decision || "Review"} | ${date(entry.reviewedAt)}\n${entry.reviewNote || ""}`
      ).join("\n\n");
      addContent(card, "Review history", history);
    }

    if (item.status === "submitted") {
      const actions = element("div", "actions");
      [
        ["Approve", "approved", "approve"],
        ["Request revision", "revision_requested", "revise"],
        ["Reject", "rejected", "reject"]
      ].forEach(([label, decision, className]) => {
        const button = element("button", className, label);
        button.addEventListener("click", () => review(item._id, decision, button));
        actions.append(button);
      });
      card.append(actions);
      card.append(element("div", "note",
        "Approval credits the worker's Data Entry USD wallet. Rejection returns the job to the public queue."));
    }

    list.append(card);
  });
}

async function review(id, decision, button) {
  let reviewNote = "";

  if (decision !== "approved") {
    reviewNote = prompt(
      decision === "rejected"
        ? "Enter the reason for rejection:"
        : "Explain what the worker must revise:"
    );

    if (reviewNote === null) return;
    reviewNote = reviewNote.trim();

    if (!reviewNote) {
      alert("A review note is required.");
      return;
    }
    if (reviewNote.length > 2000) {
      alert("The review note cannot exceed 2,000 characters.");
      return;
    }
  } else if (!confirm("Approve this submission and credit the worker's USD earnings wallet?")) {
    return;
  }

  button.disabled = true;
  errorBox.textContent = "";

  try {
    const result = await request(`/submissions/${encodeURIComponent(id)}/review`, {
      method: "PATCH",
      body: JSON.stringify({ decision, reviewNote })
    });
    alert(result.message || "Review completed.");
    await loadSubmissions();
  } catch (error) {
    errorBox.textContent = error.message;
    button.disabled = false;
  }
}

async function loadSubmissions() {
  errorBox.textContent = "";
  list.replaceChildren(element("div", "empty", "Loading submissions..."));

  try {
    const status = document.getElementById("status").value;
    const query = status ? `?status=${encodeURIComponent(status)}` : "";
    const data = await request(`/submissions${query}`);
    submissions = Array.isArray(data.submissions) ? data.submissions : [];

    document.getElementById("pending").textContent =
      submissions.filter(item => item.status === "submitted").length;
    document.getElementById("approved").textContent =
      submissions.filter(item => item.status === "approved").length;
    document.getElementById("rejected").textContent =
      submissions.filter(item => item.status === "rejected").length;

    render();
  } catch (error) {
    submissions = [];
    list.replaceChildren(element("div", "empty", "Could not load submissions."));
    errorBox.textContent = error.message;
  }
}

async function checkAdmin() {
  try {
    const response = await fetch(window.PTW_AUTH_API_ME, { credentials: "include" });
    const data = await response.json();
    const user = data.user || data;

    if (!response.ok || !["admin", "founder"].includes(user.role)) {
      document.body.replaceChildren(
        element("h2", "", "Access denied. This page is restricted.")
      );
      return false;
    }
    return true;
  } catch {
    document.body.replaceChildren(
      element("h2", "", "Authentication required. Please sign in.")
    );
    return false;
  }
}

document.getElementById("refresh").addEventListener("click", loadSubmissions);
document.getElementById("status").addEventListener("change", loadSubmissions);
document.getElementById("search").addEventListener("input", render);

(async () => {
  if (await checkAdmin()) await loadSubmissions();
})();
</script>
</body>
</html>
